
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>🌤️ Weather App</h1>
      <p>Discover the weather in your city</p>
    </header>

    <form id="weather-form">
      <input
        type="text"
        id="city-input"
        placeholder="Enter city (e.g. Guwahati)"
        aria-label="City name"
        required
      />
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status"></p>

    <section id="weather-result" hidden>
      <div class="current-weather">
        <h2 id="city-name"></h2>
        <p id="weather-description"></p>
        <div class="temperature" id="temperature"></div>
        <p id="feels-like"></p>
      </div>

      <div class="details">
        <div class="detail-card">
          <span>💧 Humidity</span>
          <strong id="humidity"></strong>
        </div>

        <div class="detail-card">
          <span>💨 Wind speed</span>
          <strong id="wind"></strong>
        </div>

        <div class="detail-card">
          <span>🌧️ Precipitation</span>
          <strong id="precipitation"></strong>
        </div>
      </div>

      <h2>5-Day Forecast</h2>
      <div id="forecast" class="forecast"></div>
    </section>

    <footer>
      Created by Jintu Das
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
